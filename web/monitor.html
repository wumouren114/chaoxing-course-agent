<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习通自动化 · 运行监控</title>
<style>
  :root{
    --bg:#f5f7fa; --card:#ffffff; --border:#e4e8ee; --text:#1f2733;
    --sub:#6b7686; --brand:#2563eb; --brand-soft:#eff4ff;
    --green:#16a34a; --green-soft:#eafaf0; --amber:#d97706; --amber-soft:#fff6e6;
    --red:#dc2626; --red-soft:#fdeeee; --shadow:0 2px 12px rgba(20,40,80,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);padding:20px;line-height:1.5}
  .wrap{max-width:1100px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  h1{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px}
  .dot{width:10px;height:10px;border-radius:50%;background:#cbd5e1;display:inline-block}
  .dot.live{background:var(--green);box-shadow:0 0 0 4px var(--green-soft);animation:pulse 1.6s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 8px rgba(22,163,74,0)}}
  .updated{font-size:12px;color:var(--sub)}
  .grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
  .card h2{font-size:14px;color:var(--sub);font-weight:600;margin-bottom:12px;letter-spacing:.3px}
  .shot-wrap{position:relative;background:#eef1f6;border-radius:10px;overflow:hidden;aspect-ratio:16/9;border:1px solid var(--border)}
  .shot-wrap img{width:100%;height:100%;object-fit:contain;display:block}
  .shot-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px}
  .shot-tag{position:absolute;top:10px;left:10px;background:rgba(20,30,50,.75);color:#fff;font-size:11px;padding:4px 9px;border-radius:6px}
  .status-line{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .badge{font-size:12px;padding:5px 11px;border-radius:20px;font-weight:600}
  .b-run{background:var(--green-soft);color:var(--green)}
  .b-idle{background:#eef1f6;color:var(--sub)}
  .b-pause{background:var(--amber-soft);color:var(--amber)}
  .b-err{background:var(--red-soft);color:var(--red)}
  .stage{font-size:14px;font-weight:600}
  .kv{display:grid;grid-template-columns:88px 1fr;gap:6px 10px;font-size:13px;margin-top:6px}
  .kv .k{color:var(--sub)}
  .progress{margin-top:16px}
  .progress .bar{height:10px;background:#eef1f6;border-radius:6px;overflow:hidden}
  .progress .fill{height:100%;background:linear-gradient(90deg,#2563eb,#3b82f6);width:0;transition:width .6s}
  .progress .labels{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:6px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
  .stat{background:var(--bg);border-radius:10px;padding:12px;text-align:center}
  .stat .n{font-size:22px;font-weight:700}
  .stat .l{font-size:11px;color:var(--sub);margin-top:2px}
  .stat.ok .n{color:var(--green)} .stat.skip .n{color:var(--amber)} .stat.err .n{color:var(--red)}
  .events{margin-top:18px}
  .log{background:#fbfcfe;border:1px solid var(--border);border-radius:10px;padding:10px 12px;height:150px;overflow-y:auto;font-size:12px;font-family:Consolas,monospace}
  .log div{padding:2px 0;color:#374151}
  .log .ok{color:var(--green)} .log .error{color:var(--red)} .log .warn{color:var(--amber)}
  .log .ts{color:#9aa5b5;margin-right:8px}
  .controls{display:flex;gap:10px;margin-top:16px}
  button{flex:1;padding:10px;border:none;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
  .btn-start{background:var(--brand);color:#fff} .btn-start:hover{background:#1d4ed8}
  .btn-pause{background:var(--amber-soft);color:var(--amber)} .btn-stop{background:var(--red-soft);color:var(--red)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .note{font-size:11px;color:var(--sub);margin-top:10px;line-height:1.6}
  .qitem{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--bg)}
  .qstem{font-size:14px;font-weight:600;margin-bottom:8px}
  .qopt{font-size:13px;color:#374151;padding:3px 0}
  .qmeta{font-size:11px;color:var(--sub);margin-top:6px}
  .qanswer{display:flex;gap:8px;margin-top:8px}
  .qanswer input{flex:1;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:13px}
  .qanswer button{flex:0 0 auto;padding:8px 14px;background:var(--brand);color:#fff}
  .qdone{font-size:13px;color:var(--green);font-weight:600;margin-top:8px}
  .quiz-alert{display:none;background:var(--amber-soft);border:1px solid var(--amber);color:var(--amber);
    font-weight:700;padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="dot" id="dot"></span>学习通自动化 · 运行监控</h1>
    <div class="updated">更新于 <span id="updated">--</span> · <span id="auto">自动刷新</span></div>
  </header>

  <div class="quiz-alert" id="quizAlert">🔔 检测到待作答弹题，请查看下方"待作答题目"区</div>

  <div class="grid">
    <!-- 左：实时截图 -->
    <div class="card">
      <h2>自动化浏览器实时画面</h2>
      <div class="shot-wrap">
        <img id="shot" src="" alt="">
        <div class="shot-empty" id="shotEmpty">等待脚本启动后显示实时截图…</div>
        <span class="shot-tag" id="shotTag">LIVE</span>
      </div>
      <div class="note">此画面为自动化 Edge 浏览器的实时截图，每 3 秒刷新。脚本只做正常网页操作（真实播放、正常点击）。</div>
    </div>

    <!-- 右：状态 -->
    <div class="card">
      <h2>运行状态</h2>
      <div class="status-line">
        <span class="badge b-idle" id="ctrlBadge">空闲</span>
        <span class="stage" id="stage">等待启动</span>
      </div>
      <div class="kv">
        <span class="k">课程</span><span id="course">--</span>
        <span class="k">当前任务</span><span id="task">--</span>
        <span class="k">提示</span><span id="message">--</span>
      </div>

      <div class="progress">
        <div class="bar"><div class="fill" id="vpFill"></div></div>
        <div class="labels"><span id="vpLabel">视频进度 0%</span><span id="vpTime">0:00 / 0:00</span></div>
      </div>

      <div class="stats">
        <div class="stat ok"><div class="n" id="sDone">0</div><div class="l">已完成</div></div>
        <div class="stat skip"><div class="n" id="sSkip">0</div><div class="l">已跳过</div></div>
        <div class="stat err"><div class="n" id="sReview">0</div><div class="l">需人工</div></div>
      </div>

      <div class="controls">
        <button class="btn-start" id="btnStart">开始</button>
        <button class="btn-pause" id="btnPause">暂停/继续</button>
        <button class="btn-stop" id="btnStop">停止</button>
      </div>
    </div>
  </div>

  <div class="card events" id="quizCard" style="display:none">
    <h2>待作答题目 <span id="quizCount" style="color:var(--amber)"></span></h2>
    <div id="quizList"></div>
  </div>

  <div class="card events">
    <h2>运行日志</h2>
    <div class="log" id="log"><div>等待事件…</div></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let lastShotVer = -1;

async function refresh(){
  try{
    const r = await fetch('live_status.json?t='+Date.now(), {cache:'no-store'});
    const d = await r.json();
    $('updated').textContent = d.updated_at || '--';
    const live = d.running && d.control==='RUNNING';
    $('dot').className = 'dot' + (live?' live':'');

    const badge = $('ctrlBadge');
    badge.textContent = ({IDLE:'空闲',RUNNING:'运行中',PAUSED:'已暂停',STOPPING:'停止中',STOPPED:'已停止'})[d.control]||d.control;
    badge.className = 'badge ' + (d.control==='RUNNING'?'b-run':d.control==='PAUSED'?'b-pause':d.control==='ERROR'?'b-err':'b-idle');
    $('stage').textContent = d.stage||'--';
    $('course').textContent = d.course_name||d.course||'--';
    $('task').textContent = d.task_title ? (d.task_title+(d.task?' ['+d.task+']':'')) : '--';
    $('message').textContent = d.message||'--';

    const v = d.video||{};
    $('vpFill').style.width = (v.pct||0)+'%';
    $('vpLabel').textContent = '视频进度 '+(v.pct||0)+'%';
    $('vpTime').textContent = v.display||'0:00 / 0:00';

    const s = d.stats||{};
    $('sDone').textContent = s.completed||0;
    $('sSkip').textContent = s.skipped||0;
    $('sReview').textContent = s.review||0;

    // 截图（带版本号避免缓存）
    if(d.shot_version && d.shot_version!==lastShotVer){
      lastShotVer = d.shot_version;
      $('shot').src = 'live_screenshot.png?v='+d.shot_version+'&t='+Date.now();
      $('shotEmpty').style.display='none';
    }
  }catch(e){}
  try{
    const r2 = await fetch('live_events.json?t='+Date.now(), {cache:'no-store'});
    const evs = await r2.json();
    $('log').innerHTML = evs.map(e=>
      `<div class="${e.level}"><span class="ts">${e.ts}</span>${e.text}</div>`
    ).join('') || '<div>等待事件…</div>';
    $('log').scrollTop = $('log').scrollHeight;
  }catch(e){}
  refreshQuestions();
}

async function refreshQuestions(){
  try{
    const r = await fetch('/api/questions?t='+Date.now(), {cache:'no-store'});
    const qs = await r.json();
    const pend = (qs||[]).filter(q=>q.status==='PENDING');
    $('quizAlert').style.display = pend.length ? 'block' : 'none';
    if(pend.length) $('quizAlert').textContent = `🔔 有 ${pend.length} 道弹题待作答，请查看下方"待作答题目"区`;
    if(!qs || qs.length===0){ $('quizCard').style.display='none'; return; }
    $('quizCard').style.display='block';
    $('quizCount').textContent = '（'+qs.filter(q=>q.status==='PENDING').length+' 待答）';
    $('quizList').innerHTML = qs.map(q=>{
      const opts = (q.options||[]).map((o,i)=>`<div class="qopt">${String.fromCharCode(65+i)}. ${o}</div>`).join('');
      if(q.status==='ANSWERED'){
        return `<div class="qitem">
          <div class="qstem">${q.stem}</div>${opts}
          <div class="qdone">✓ 已作答：${q.answer}</div>
          <div class="qmeta">${q.analysis||''}</div></div>`;
      }
      return `<div class="qitem" id="q_${q.id}">
        <div class="qstem">${q.stem}</div>${opts}
        <div class="qmeta">${q.qtype||'题型未知'} · ${q.context||''} · ${q.created_at||''}</div>
        <div class="qanswer">
          <input id="a_${q.id}" placeholder="填入答案，如 A 或 AB">
          <button onclick="submitAnswer('${q.id}')">作答</button>
        </div></div>`;
    }).join('');
  }catch(e){}
}

async function submitAnswer(id){
  const answer = document.getElementById('a_'+id).value.trim();
  if(!answer){ alert('请输入答案'); return; }
  await fetch('/api/answer',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id,answer,analysis:'面板作答'})});
  refreshQuestions();
}

// 控制按钮：向 control_signal.json 写指令，调度器读取
async function send(cmd){
  await fetch('control_signal.json?t='+Date.now(), {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({command:cmd, ts:Date.now()})
  }).catch(()=>{});
  $('message').textContent='已发送指令: '+cmd;
}
$('btnStart').onclick=()=>send('start');
$('btnPause').onclick=()=>send('pause_toggle');
$('btnStop').onclick=()=>send('stop');

refresh();
setInterval(refresh, 1500);
</script>
</body>
</html>
